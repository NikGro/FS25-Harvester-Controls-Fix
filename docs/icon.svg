<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3b2c"/>
      <stop offset="1" stop-color="#0f1f17"/>
    </linearGradient>
    <linearGradient id="log" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4f2a"/>
      <stop offset="0.5" stop-color="#b9824e"/>
      <stop offset="1" stop-color="#7a4f2a"/>
    </linearGradient>
    <radialGradient id="cut" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3d9a8"/>
      <stop offset="0.75" stop-color="#d9b07a"/>
      <stop offset="1" stop-color="#8a5a30"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c230"/>
      <stop offset="1" stop-color="#c99412"/>
    </linearGradient>
    <clipPath id="frame"><rect width="512" height="512" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- background spruces -->
    <g fill="#2c5240">
      <path d="M40 420 L80 250 L120 420 Z"/><path d="M110 430 L150 210 L190 430 Z"/>
      <path d="M380 430 L425 230 L470 430 Z"/><path d="M440 440 L480 280 L520 440 Z"/>
    </g>
    <!-- crane boom -->
    <path d="M512 40 L330 120" stroke="#3a3a3a" stroke-width="30" stroke-linecap="round"/>
    <path d="M330 120 L300 170" stroke="#3a3a3a" stroke-width="22" stroke-linecap="round"/>
    <!-- log held horizontally -->
    <rect x="40" y="268" width="420" height="78" rx="39" fill="url(#log)" transform="rotate(-8 250 307)"/>
    <ellipse cx="52" cy="337" rx="24" ry="39" fill="url(#cut)" transform="rotate(-8 52 337)"/>
    <g fill="none" stroke="#a46c38" stroke-width="2.5" opacity="0.8" transform="rotate(-8 52 337)">
      <ellipse cx="52" cy="337" rx="14" ry="23"/><ellipse cx="52" cy="337" rx="6" ry="10"/>
    </g>
    <!-- harvester head -->
    <g>
      <rect x="244" y="170" width="120" height="96" rx="14" fill="url(#head)"/>
      <rect x="258" y="186" width="92" height="16" rx="6" fill="#2b2b2b" opacity="0.85"/>
      <circle cx="304" cy="168" r="18" fill="#3a3a3a"/>
      <!-- knives around the log -->
      <path d="M248 236 C210 250 204 330 236 362" fill="none" stroke="#2b2b2b" stroke-width="16" stroke-linecap="round"/>
      <path d="M360 226 C398 238 404 316 372 348" fill="none" stroke="#2b2b2b" stroke-width="16" stroke-linecap="round"/>
      <!-- feed rollers -->
      <circle cx="262" cy="350" r="22" fill="#4a4a4a"/><circle cx="262" cy="350" r="9" fill="#2b2b2b"/>
      <circle cx="350" cy="336" r="22" fill="#4a4a4a"/><circle cx="350" cy="336" r="9" fill="#2b2b2b"/>
    </g>
    <!-- feed direction -->
    <g fill="#f2c230">
      <path d="M150 420 L196 410 L188 396 L232 404 L196 432 L198 418 L152 428 Z" opacity="0.9"/>
    </g>
    <!-- check badge = fixed version -->
    <circle cx="430" cy="430" r="58" fill="#f2c230" stroke="#0f1f17" stroke-width="8"/>
    <path d="M400 432 L422 456 L462 404" fill="none" stroke="#0f1f17" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="54" fill="none" stroke="#0a140e" stroke-width="6"/>
</svg>
